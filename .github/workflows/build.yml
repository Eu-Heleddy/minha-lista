name: Gerar APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparar app
        run: |
          mkdir www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Minha Lista" com.minhalista.app --web-dir www
          npx cap add android
      - name: Aplicar icone
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image
          im = Image.open('icon-only.png').convert('RGBA')
          w = im.width
          m = int(w * 0.1)
          crop = im.crop((m, m, w - m, w - m))
          sizes = {'mdpi': (48, 108), 'hdpi': (72, 162), 'xhdpi': (96, 216), 'xxhdpi': (144, 324), 'xxxhdpi': (192, 432)}
          base = 'android/app/src/main/res/'
          for k, (l, f) in sizes.items():
              p = base + 'mipmap-' + k + '/'
              im.resize((l, l)).save(p + 'ic_launcher.png')
              im.resize((l, l)).save(p + 'ic_launcher_round.png')
              c = Image.new('RGBA', (f, f), (0, 0, 0, 0))
              s = int(f * 0.66)
              c.paste(crop.resize((s, s)), ((f - s) // 2, (f - s) // 2))
              c.save(p + 'ic_launcher_foreground.png')
          open(base + 'values/ic_launcher_background.xml', 'w').write('<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#000000</color></resources>')
          PY
      - name: Sincronizar
        run: npx cap sync android
      - name: Compilar APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MinhaLista-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
