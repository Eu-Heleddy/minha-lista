   h+=`<div class="hd" data-v="${v}">${IC[v]}<b>${NAMES[v]}</b><span>${all.length} ›</span></div><div class="car">`+(its.length?its.map((o,j)=>`<div class="sl g${j%2}" data-open="${o.k}:${o.i}"><div class="sw"><b>${esc(o.x.n)}</b><span>${esc([o.x.y,o.x.st].filter(Boolean).join(' · ')||lab(o.x,o.k))}</span></div><div class="se">${emo(o.x,o.k)}</div><div class="pb"><u style="width:${P(o.x,o.k)}%"></u></div></div>`).join(''):`<div class="sl g0" data-v="${v}"><div class="sw"><b>Vazio</b><span>Toque para adicionar</span></div></div>`)+`</div><div class="dots">${its.length>1?its.map((_,j)=>`<i class="${j?'':'on'}"></i>`).join(''):''}</div>`;
  }
 }else{
  const k=key();
  if(SUBS[view])h+=`<div class="tabs">${Object.entries(SUBS[view]).map(([s,n])=>`<button class="${s==sub?'on':''}" data-sub="${s}">${n}</button>`).join('')}</div>`;
  const ph={fazer:'O que você quer fazer?',serie:'Buscar série ou digitar o nome',filme:'Buscar filme ou digitar o nome',anime:'Buscar anime ou digitar o nome',cf:'Buscar prato para fazer',cc:'Buscar o que comprar'}[k];
  h+=`<h2 style="margin-top:${SUBS[view]?0:14}px">${NAMES[view]}</h2><div class="add"><input id="inp" value="${esc(q)}" placeholder="${ph}" autocomplete="off" enterkeyhint="done"><div class="sug" id="sug" ${sug.length?'':'hidden'}>${sugH()}</div></div>`;
  h+=S[k].length?S[k].map((x,i)=>card(x,k,i)).join(''):`<div class="empty">Lista vazia. Digite acima para adicionar.</div>`;
 }
 $('#app').innerHTML=h;const inp=$('#inp');if(inp&&document.body.dataset.focus){inp.focus();inp.setSelectionRange(q.length,q.length)}
}
const sugH=()=>sug.map((s,i)=>`<button data-pick="${i}"><span>${s.e||EM[key()]}</span><span>${esc(s.n)}<br><small>${esc([s.y,s.st].filter(Boolean).join(' · '))}</small></span></button>`).join('');
function mk(s,k){const x={id:Date.now(),n:s.n,y:s.y||'',st:s.st||'',p:0,note:''};if(s.e)x.e=s.e;
 if(isS(k)){x.E=s.v||[12];x.t=1;x.ep=0}if(k=='filme'){x.m=s.v||120;x.sec=0}if(k=='cf'){x.ing='';x.steps=[]}return x}
function add(s){const k=key();S[k].push(mk(s,k));save();q='';sug=[];render()}
function toast(m){const t=document.createElement('div');t.id='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),4000)}
const tot=(x,i)=>sum(x.steps[i].subs.map(u=>+u.m||0))*60;
const mmss=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function tmT(x,i){const t=T[x.id+':'+i];return (t&&t.run?'❚❚ ':'▶ ')+mmss(t?t.left:tot(x,i))}
function rec(x){return `<textarea id="ing" placeholder="Ingredientes (um por linha)" rows="4">${esc(x.ing)}</textarea><h2>Preparo</h2>`+x.steps.map((s,i)=>`<div class="st ${s.d?'dn':''}"><div class="sh"><button data-sdn="${i}" aria-label="Concluir etapa">${s.d?'✓':'○'}</button><input class="ti" data-sn="${i}" value="${esc(s.n)}" placeholder="Nome da etapa">${tot(x,i)?`<button class="tm" data-tm="${i}"><span id="tm${i}">${tmT(x,i)}</span></button>`:''}<button data-sx="${i}" aria-label="Remover etapa">✕</button></div>`+s.subs.map((u,j)=>`<div class="su"><input data-st="${i}:${j}" value="${esc(u.t)}" placeholder="Ex.: 180°C"><input type="number" class="mn" data-sm="${i}:${j}" value="${u.m||''}" placeholder="min"><button data-sd="${i}:${j}" aria-label="Remover">✕</button></div>`).join('')+`<button class="ln" data-sa="${i}">+ especificação</button></div>`).join('')+`<div class="add2"><input id="nst" placeholder="Nova etapa (ex.: Forno)"><button data-an="1">Adicionar</button></div>`}
function sheet(){
 const old=$('#modal');const sc=old?old.firstChild.scrollTop:0;if(old)old.remove();if(!open)return;
 const k=open.k,x=cur();if(!x){open=null;return}let b='';
 if(isS(k)){const n=x.E[x.t-1];b=`<div class="two"><label>Temporada<select id="sT">${x.E.map((_,i)=>`<option value="${i+1}" ${i+1==x.t?'selected':''}>T${i+1}</option>`).join('')}</select></label><label>Episódio (de ${n})<input id="sE" type="number" min="0" max="${n}" value="${x.ep}"></label></div><input type="range" id="rg" min="0" max="${n}" value="${x.ep}" aria-label="Episódio"><details><summary>Corrigir dados da obra</summary><div class="two"><label>Temporadas<input id="nT" type="number" min="1" value="${x.E.length}"></label><label>Eps. da T${x.t}<input id="nE" type="number" min="1" value="${n}"></label></div></details>`}
 else if(k=='filme')b=`<input type="range" id="rg" min="0" max="${x.m*60}" value="${x.sec}" aria-label="Tempo assistido"><details><summary>Corrigir duração</summary><label>Duração (min)<input id="nM" type="number" min="1" value="${x.m}"></label></details>`;
 else if(k=='fazer')b=`<input type="range" id="rg" min="0" max="100" step="5" value="${x.p}" aria-label="Progresso">`;
 else if(k=='cc')b=`<button class="wide" data-buy="1">${x.p?'✓ Comprado (desfazer)':'Marcar como comprado'}</button>`;
 else b=rec(x);
 const m=document.createElement('div');m.className='modal';m.id='modal';
 m.innerHTML=`<div class="sheet" role="dialog" aria-label="${esc(x.n)}"><div class="av" id="mav" style="--g:${P(x,k)}"><i>${emo(x,k)}</i></div><b style="font-size:20px">${esc(x.n)}</b><div class="s">${esc([x.y,x.st].filter(Boolean).join(' · '))}</div><div class="big" id="pl">${esc(k=='cf'||k=='cc'?lab(x,k):lab(x,k)+' · '+Math.round(P(x,k))+'%')}</div>${b}${k=='cf'?'':`<textarea id="nt" rows="2" placeholder="Anotações" style="margin-top:8px">${esc(x.note)}</textarea>`}<div class="row"><button class="del" data-del="1">Remover</button><button class="ok" data-close="1">Pronto</button></div></div>`;
 document.body.appendChild(m);m.firstChild.scrollTop=sc}
function live(){const x=cur(),k=open.k;$('#mav').style.setProperty('--g',P(x,k));$('#pl').textContent=lab(x,k)+' · '+Math.round(P(x,k))+'%';save()}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-v],[data-sub],[data-pick],[data-mv],[data-open],[data-del],[data-close],[data-sdn],[data-sx],[data-sa],[data-sd],[data-an],[data-tm],[data-buy]');
 if(!t){if(e.target.id=='modal'){open=null;sheet();render()}return}
 const d=t.dataset,x=open?cur():null;
 if(d.v){view=d.v;sub=view=='assistir'?'serie':view=='comer'?'cf':'';q='';sug=[];render();scrollTo(0,0)}
 else if(d.sub){sub=d.sub;q='';sug=[];render()}
 else if(d.pick!==undefined)add(sug[+d.pick]);
 else if(d.mv){e.stopPropagation();const[k,i,s]=d.mv.split(':'),a=S[k],i1=+i,j=i1+ +s;if(j>=0&&j<a.length){[a[i1],a[j]]=[a[j],a[i1]];save();render()}}
 else if(d.open){const[k,i]=d.open.split(':');open={k,i:+i};sheet()}
 else if(d.del){S[open.k].splice(open.i,1);save();open=null;sheet();render()}
 else if(d.close){open=null;sheet();render()}
 else if(d.buy){x.p=x.p?0:100;save();sheet()}
 else if(d.sdn){x.steps[+d.sdn].d^=1;save();sheet()}
 else if(d.sx){x.steps.splice(+d.sx,1);for(const k in T)if(k.startsWith(x.id+':'))delete T[k];save();sheet()}
 else if(d.sa){const i=+d.sa;x.steps[i].subs.push({t:'',m:''});save();sheet();const el=document.querySelector(`[data-st="${i}:${x.steps[i].subs.length-1}"]`);el&&el.focus()}
 else if(d.sd){const[i,j]=d.sd.split(':');x.steps[+i].subs.splice(+j,1);delete T[x.id+':'+i];save();sheet()}
 else if(d.an){const v=$('#nst').value.trim();x.steps.push({n:v||'Etapa '+(x.steps.length+1),subs:[],d:0});save();sheet()}
 else if(d.tm){const i=+d.tm,id=x.id+':'+i,tt=tot(x,i);const r=T[id]||(T[id]={left:tt,run:false});if(r.left<=0)r.left=tt;r.run=!r.run;sheet()}
});
document.addEventListener('input',e=>{const el=e.target,d=el.dataset,x=open?cur():null;
 if(el.id=='inp'){q=el.value;const n=norm(q.trim()),k=key(),c=k=='cf'||k=='cc'?'comer':k;sug=n&&D[c]?cat(c).filter(s=>norm(s.n).includes(n)).slice(0,8):[];const s=$('#sug');s.innerHTML=sugH();s.hidden=!sug.length}
 else if(el.id=='rg'){const k=open.k;if(isS(k)){x.ep=+el.value;$('#sE').value=x.ep}else if(k=='filme')x.sec=+el.value;else x.p=+el.value;live()}
 else if(el.id=='nt'){x.note=el.value;save()}else if(el.id=='ing'){x.ing=el.value;save()}
 else if(d.sn!==undefined){x.steps[+d.sn].n=el.value;save()}
 else if(d.st){const[i,j]=d.st.split(':');x.steps[+i].subs[+j].t=el.value;save()}
 else if(d.sm){const[i,j]=d.sm.split(':');x.steps[+i].subs[+j].m=el.value;save()}});
document.addEventListener('change',e=>{const el=e.target,x=open?cur():null,v=+el.value;
 if(el.id=='sT'){x.t=v;x.ep=Math.min(x.ep,x.E[v-1]);save();sheet()}
 else if(el.id=='sE'){x.ep=cl(v,0,x.E[x.t-1]);save();sheet()}
 else if(el.id=='nT'){const n=cl(v,1,99);while(x.E.length<n)x.E.push(x.E[x.E.length-1]);x.E.length=n;x.t=Math.min(x.t,n);x.ep=Math.min(x.ep,x.E[x.t-1]);save();sheet()}
 else if(el.id=='nE'){x.E[x.t-1]=Math.max(1,v);x.ep=Math.min(x.ep,x.E[x.t-1]);save();sheet()}
 else if(el.id=='nM'){x.m=Math.max(1,v);x.sec=Math.min(x.sec,x.m*60);save();sheet()}
 else if(el.dataset.sm)setTimeout(sheet,300)});
document.addEventListener('focusin',e=>{document.body.dataset.focus=e.target.id=='inp'?'1':''});
document.addEventListener('keydown',e=>{if(e.target.id=='inp'&&e.key=='Enter'&&q.trim()){const k=key(),c=k=='cf'||k=='cc'?'comer':k,n=norm(q.trim()),hit=D[c]&&cat(c).find(s=>norm(s.n)==n);add(hit||{n:q.trim()})}});
document.addEventListener('scroll',e=>{const c=e.target;if(c.classList&&c.classList.contains('car')){const i=Math.round(c.scrollLeft/c.clientWidth),ds=c.nextElementSibling.children;[...ds].forEach((d,j)=>d.classList.toggle('on',j==i))}},true);
setInterval(()=>{for(const id in T){const r=T[id];if(!r.run)continue;r.left--;const[xid,i]=id.split(':'),x=open&&cur();
 if(r.left<=0){r.left=0;r.run=false;try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}toast('⏰ Tempo da etapa acabou!');if(x&&x.id==xid)sheet()}
 else if(x&&x.id==xid){const s=$('#tm'+i);if(s)s.textContent=tmT(x,+i)}}},1000);
render();
</script></body></html>
